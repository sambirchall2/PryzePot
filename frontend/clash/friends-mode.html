<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Mode | PryzePot</title>

    <link rel="stylesheet" href="friends-mode.css">
    <link rel="stylesheet" href="../css/toast.css">
</head>

<body>

<div class="page">

    <div class="top-bar">
        <button id="backButton" class="back-button">←</button>
        <h1>Friends Mode</h1>
    </div>

    <div class="section-title">
        🟢 Online
    </div>

    <div id="onlineFriendsList" class="friends-list">
        <div class="loading-card">Loading...</div>
    </div>

    <div class="section-title">
        ⚫ Offline
    </div>

    <div id="offlineFriendsList" class="friends-list">
        <div class="loading-card">Loading...</div>
    </div>

</div>

<div id="challengeModal" class="challenge-modal hidden">
    <div class="challenge-box">

        <button id="closeChallengeModal" class="challenge-close-btn">×</button>

        <p class="challenge-eyebrow">FRIEND CHALLENGE</p>

        <h2 id="challengeTitle">Challenge Player</h2>

        <p class="challenge-subtitle">
            Choose an entry fee for this private Clash Royale match.
        </p>

        <div class="challenge-fees">
            <button class="challenge-fee-btn" data-entry-fee="1">$1</button>
            <button class="challenge-fee-btn" data-entry-fee="2">$2</button>
            <button class="challenge-fee-btn" data-entry-fee="5">$5</button>
            <button class="challenge-fee-btn" data-entry-fee="10">$10</button>
            <button class="challenge-fee-btn" data-entry-fee="50">$50</button>
            <button class="challenge-fee-btn" data-entry-fee="100">$100</button>
        </div>

        <button id="sendChallengeButton" class="send-challenge-button" disabled>
            Select Entry Fee
        </button>

    </div>
</div>

<script src="../js/toast.js"></script>
<script src="friends-mode.js"></script>

</body>
</html>
