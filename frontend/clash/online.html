<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Mode | PryzePot</title>
    <link rel="stylesheet" href="online.css">
</head>
<body>

    <button id="backBtn" class="back-btn">‹</button>

    <main class="online-page">

        <h1>Play Clash</h1>
        <p class="subtitle">Choose how you want to compete.</p>

        <button id="createMatchBtn" class="online-option">
            <span>Online Mode</span>
            <small>Post or join public 1v1 matches</small>
        </button>

        <button id="friendsModeBtn" class="online-option">
            <span>Friends Mode</span>
            <small>Challenge your friends privately</small>
        </button>

        <button id="tournamentModeBtn" class="online-option">
            <span>Tournament Mode</span>
            <small>Join brackets and special events</small>
        </button>

    </main>

    <script src="online.js"></script>

</body>
</html>
