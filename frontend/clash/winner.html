<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Result | PryzePot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="winner.css">
    <link rel="stylesheet" href="../css/coin-icon.css">
</head>
<body>

    <div id="confettiContainer"></div>

    <main class="winner-page">

        <div id="resultBadge" class="result-badge">
            Match Complete
        </div>

        <h1 id="resultTitle">YOU WON</h1>

        <p id="resultSubtitle" class="subtitle">
            Prize secured. Match result submitted.
        </p>

        <div class="prize-card">
            <span>Entry Amount</span>
            <strong id="entryAmount"><img class="coin-icon" src="../assets/p-coin-small.png" alt="Vault Credits">0</strong>
        </div>

        <button id="homeBtn" class="main-btn">
            BACK TO HOME
        </button>

        <button id="boardBtn" class="secondary-btn">
            MATCH BOARD
        </button>

    </main>

    <script src="../js/api.js"></script>
    <script src="winner.js"></script>

</body>
</html>
