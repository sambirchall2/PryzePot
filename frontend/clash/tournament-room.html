<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Room | PryzePot</title>
    <link rel="stylesheet" href="tournament-room.css">
    <link rel="stylesheet" href="../css/profile-system.css">
</head>
<body>

<div class="container">

    <h1>Tournament Room</h1>

    <div class="tournament-card">

        <div class="row">
            <span>Tournament Size</span>
            <span id="tournamentSize">4 Players</span>
        </div>

        <div class="row">
            <span>Entry Fee</span>
            <span id="entryFee">$1</span>
        </div>

        <div class="row">
            <span>Prize Pool</span>
            <span id="prizePool">$4</span>
        </div>

    </div>

    <div class="players-section">
        <h2>Players Joined</h2>
        <div id="playerList"></div>
    </div>

    <div class="bracket-section hidden" id="bracketSection">
        <h2>Bracket</h2>
        <div id="bracketList"></div>
    </div>

    <div id="statusCard" class="status-card">
        Waiting for tournament to fill...
    </div>

    <button id="cancelTournamentBtn" class="cancel-tournament-btn hidden">
        CANCEL TOURNAMENT
    </button>

</div>
<div id="advanceModal" class="advance-modal hidden">
    <div class="advance-box">
        <div class="advance-icon">🔥</div>
        <p class="advance-small">FINAL ROUND UNLOCKED</p>
        <h2>YOU ADVANCED</h2>
        <p>You made it to the next round. One more win for the crown.</p>
        <button id="advanceContinueBtn">CONTINUE</button>
    </div>
</div>
<script src="../js/profile-system.js"></script>
<script src="tournament-room.js"></script>

</body>
</html>
