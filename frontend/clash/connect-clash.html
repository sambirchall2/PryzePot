<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Clash Royale | PryzePot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="connect-clash.css">
</head>
<body>

    <button id="backBtn" class="back-btn">‹</button>

    <main class="connect-page">

        <h1>Connect Clash Royale</h1>

        <p class="subtitle">
            Add your player tag and friend invite link so opponents can add you without searching.
        </p>
        <div class="link-warning">
    ⚠️ Update your Clash Royale friend link every 24 hours. Friend links may expire after 48 hours.
</div>

        <div class="connect-box">

            <label for="playerTagInput">Player Tag</label>
            <input
                id="playerTagInput"
                type="text"
                placeholder="#ABC123"
            >

            <label for="friendLinkInput">Friend Invite Link</label>
            <input
                id="friendLinkInput"
                type="text"
                placeholder="https://link.clashroyale.com/invite/friend/..."
            >

            <button id="verifyBtn" class="verify-btn">
                VERIFY ACCOUNT
            </button>

            <p id="statusText" class="status-text">
                Not connected
            </p>

        </div>

    </main>

    <script src="../js/api.js"></script>
    <script src="connect-clash.js"></script>

</body>
</html>
