<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Match | PryzePot</title>
    <link rel="stylesheet" href="post-match.css">
</head>
<body>

    <button id="backBtn" class="back-btn">‹</button>

    <main class="post-page">

        <h1>Post Match</h1>
        <p class="subtitle">Review your 1v1 challenge before posting.</p>

        <div class="summary-box">

            <div class="summary-row">
                <span>Game</span>
                <strong>Clash Royale</strong>
            </div>

            <div class="summary-row">
                <span>Mode</span>
                <strong>1v1 Friendly Battle</strong>
            </div>

            <div class="summary-row">
                <span>Entry Amount</span>
                <strong id="entryAmountDisplay">$0</strong>
            </div>

            <div class="summary-row">
                <span>Clash Tag</span>
                <strong id="playerTagDisplay">Not connected</strong>
            </div>

        </div>

        <button id="postMatchBtn" class="post-btn">
            POST MATCH
        </button>

    </main>

    <script src="post-match.js"></script>

</body>
</html>
