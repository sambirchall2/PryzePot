<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Chess.com | PryzePot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="connect-chess.css">
</head>
<body>

    <button id="backBtn" class="back-btn">‹</button>

    <main class="connect-page">

        <h1>Connect Chess.com</h1>

        <p class="subtitle">
            Enter your Chess.com username so opponents can challenge you directly.
        </p>

        <div class="connect-box">

            <label for="chessUsernameInput">Chess.com Username</label>
            <input
                id="chessUsernameInput"
                type="text"
                placeholder="your-username"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
            >

            <button id="verifyBtn" class="verify-btn">
                VERIFY ACCOUNT
            </button>

            <p id="statusText" class="status-text">
                Not connected
            </p>

        </div>

    </main>

    <script src="../js/api.js"></script>
    <script src="connect-chess.js"></script>

</body>
</html>
