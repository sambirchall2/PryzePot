<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Board | PryzePot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="match-board.css">
    <link rel="stylesheet" href="../css/coin-icon.css">
</head>
<body>

    <button id="backBtn" class="back-btn">‹</button>

    <main class="board-page">

        <div class="page-header">
            <p class="eyebrow">CHESS.COM</p>
            <h1>Join Game</h1>
            <p class="subtitle">
                Choose an open tournament or 1v1 match.
            </p>
        </div>

        <section class="player-tournaments">
            <p class="section-label">PLAYER TOURNAMENTS</p>

            <div id="tournamentsContainer" class="empty-tournament-state">
                No open player tournaments yet.
            </div>
        </section>

        <section class="open-matches">
            <p class="section-label">OPEN 1V1 MATCHES</p>

            <div id="matchesContainer"></div>
        </section>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/profile-system.js"></script>
    <script src="match-board.js"></script>

</body>
</html>
