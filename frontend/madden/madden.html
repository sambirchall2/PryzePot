<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madden NFL | PryzePot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="madden.css">
</head>
<body>

    <button id="backBtn" class="back-btn">‹</button>

    <main class="clash-page">

        <img class="clash-logo" src="../assets/games/madden-nfl.png" alt="Madden NFL">

        <div id="onlineMode" class="mode-card">
            <img src="../assets/online-mode.png" alt="Online Mode">
        </div>

        <div id="friendsMode" class="mode-card">
            <img src="../assets/friends-mode.png" alt="Friends Mode">
        </div>

        <div id="tournamentMode" class="mode-card disabled-card">
            <span class="coming-soon">COMING SOON</span>
            <img src="../assets/tournament-mode.png" alt="Tournament Mode">
        </div>

    </main>

    <script src="../js/api.js"></script>
    <script src="madden.js"></script>

</body>
</html>
