<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PryzePot Profile</title>

    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/profile-system.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/coin-icon.css">
</head>

<body>

<div class="profile-page">

    <div class="profile-banner">
        <img id="profileBanner"
             class="banner-image"
             src="../assets/profile/banner1.png"
             alt="Banner">

        <button id="backButton" class="back-button">
            ← Back
        </button>
    </div>

    <div class="profile-header">

        <div class="avatar-wrapper">

            <img
                id="profileAvatar"
                class="profile-avatar"
                src="../assets/profile/avatar1.png"
                alt="Avatar">

            <img
                id="profileFrame"
                class="profile-frame hidden"
                src=""
                alt="Frame">

        </div>

        <h1 id="profileUsername">Loading...</h1>

        <img
            id="profileBadge"
            class="profile-badge hidden"
            src=""
            alt="Badge">

        <div
            id="profileTitle"
            class="profile-title-pill hidden">
        </div>

        <div
            id="profileLevel"
            class="profile-level-pill">
            Level 1
        </div>

    </div>

    <div class="xp-card">

        <div class="xp-top">
            <span id="xpCurrent">0 XP</span>
            <span id="xpNext">Lvl 2</span>
        </div>

        <div class="xp-bar">
            <div id="xpFill" class="xp-fill"></div>
        </div>

    </div>

    <div class="stats-section">

        <div class="stat-card lifetime-card">

            <div
                id="lifetimeWinnings"
                class="stat-value big-value">
                $0
            </div>

            <div class="stat-title">
                Lifetime Winnings
            </div>

        </div>

        <div class="small-stats-row">

            <div class="stat-card small-stat-card">

                <div
                    id="record"
                    class="stat-value">
                    0 / 0
                </div>

                <div class="stat-title">
                    1v1 Record
                </div>

            </div>

            <div class="stat-card small-stat-card">

                <div
                    id="tournamentWins"
                    class="stat-value">
                    0
                </div>

                <div class="stat-title">
                    Tournament Wins
                </div>

            </div>

        </div>

    </div>

    <button
        id="chatFriendButton"
        class="chat-friend-button hidden">
        Chat
    </button>

    <button
        id="profileActionButton"
        class="profile-action-button">
        Edit Profile
    </button>

    <button
        id="removeFriendButton"
        class="remove-friend-button hidden">
        Remove Friend
    </button>

</div>

<div id="challengeModal" class="challenge-modal hidden">

    <div class="challenge-box">

        <button
            id="closeChallengeModal"
            class="challenge-close-btn">
            ×
        </button>

        <p class="challenge-eyebrow">
            FRIEND CHALLENGE
        </p>

        <h2 id="challengeTitle">
            Challenge Player
        </h2>

        <p class="challenge-subtitle">
            Choose an entry fee for this private Clash Royale match.
        </p>

        <div class="challenge-fees">

            <button class="challenge-fee-btn" data-entry-fee="25"><img class="coin-icon" src="../assets/p-coin-small.png" alt="P-Coins">25</button>
            <button class="challenge-fee-btn" data-entry-fee="50"><img class="coin-icon" src="../assets/p-coin-small.png" alt="P-Coins">50</button>
            <button class="challenge-fee-btn" data-entry-fee="100"><img class="coin-icon" src="../assets/p-coin-small.png" alt="P-Coins">100</button>
            <button class="challenge-fee-btn" data-entry-fee="250"><img class="coin-icon" src="../assets/p-coin-small.png" alt="P-Coins">250</button>
            <button class="challenge-fee-btn" data-entry-fee="500"><img class="coin-icon" src="../assets/p-coin-small.png" alt="P-Coins">500</button>
            <button class="challenge-fee-btn" data-entry-fee="1000"><img class="coin-icon" src="../assets/p-coin-small.png" alt="P-Coins">1000</button>
            <button class="challenge-fee-btn" data-entry-fee="2500"><img class="coin-icon" src="../assets/p-coin-small.png" alt="P-Coins">2500</button>

        </div>

        <button
            id="sendChallengeButton"
            class="send-challenge-button"
            disabled>
            Select Entry Fee
        </button>

    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/profile-system.js"></script>
<script src="../js/profile.js"></script>

</body>
</html>
