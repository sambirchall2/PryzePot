<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PryzePot Leaderboard</title>
    <link rel="stylesheet" href="../css/leaderboard.css">
</head>

<body>

<div class="leaderboard-page">

    <div class="top-bar page-animate">
        <button id="backButton" class="back-button">←</button>

        <h1 class="leaderboard-title">
            LEADERBOARD
        </h1>
    </div>

    <div class="time-filter-row page-animate delay-1">
        <span class="filter-label">STATS OF THE</span>

        <button class="time-pill active" data-time="week">WEEK</button>
        <button class="time-pill" data-time="day">DAY</button>
        <button class="time-pill" data-time="month">MONTH</button>
        <button class="time-pill" data-time="all">ALL</button>
    </div>

    <div class="game-filter-row page-animate delay-2">
        <button class="game-pill active" data-game="all">
            <span class="game-icon all-icon">PP</span>
            <span>ALL</span>
        </button>

        <button class="game-pill" data-game="clash">
            <img src="../assets/clashroyale.jpg" alt="Clash Royale">
            <span>CLASH</span>
        </button>

        <button class="game-pill locked" data-game="sf6">
            <span class="game-icon">SF6</span>
            <span>SOON</span>
        </button>

        <button class="game-pill locked" data-game="rocketleague">
            <span class="game-icon">RL</span>
            <span>SOON</span>
        </button>

        <button class="game-pill locked" data-game="valorant">
            <span class="game-icon">VAL</span>
            <span>SOON</span>
        </button>
    </div>

    <section class="top-section page-animate delay-3">
        <div class="section-label">TOP PLAYERS</div>

        <div id="podium" class="podium"></div>
    </section>

    <section class="ranking-section page-animate delay-4">
        <div class="ranking-header">
            <span>RANK</span>
            <span>PLAYER</span>
            <span>WINNINGS</span>
        </div>

        <div id="leaderboardList" class="leaderboard-list"></div>
    </section>

    <section id="yourRankCard" class="your-rank-card page-animate delay-5"></section>

</div>

<div id="toast" class="toast">Coming Soon</div>

<script src="../js/leaderboard.js"></script>

</body>
</html>
