<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PryzePot Home</title>
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>

<div id="menuOverlay" class="menu-overlay"></div>

<div id="sideMenu" class="side-menu">

    <div class="menu-header">
        Menu
    </div>

    <button id="profileBtn" class="menu-btn">
        Profile
    </button>

    <button class="menu-btn">
        Friends (Coming Soon)
    </button>

    <button class="menu-btn">
        Settings (Coming Soon)
    </button>

    <button id="menuLogoutBtn" class="menu-btn logout-btn">
        Logout
    </button>

</div>

<div class="app-shell">

    <div class="top-bar">

        <div id="menuToggle" class="left-section">
            ☰
        </div>

        <div class="brand-section">
    <img
        src="../assets/pryzepot-header.png"
        alt="PryzePot"
        class="header-logo"
    >
</div>

        <div id="logoutBtn" class="right-section">
            Logout
        </div>

    </div>

    <div class="home-profile-card">

        <img id="homeBannerImage" class="home-banner-image" src="../assets/profile/banner1.png" alt="Profile Banner">

        <div class="home-profile-overlay"></div>

        <div class="home-profile-content">

            <img id="homeAvatarImage" class="home-avatar-image" src="../assets/profile/avatar1.png" alt="Profile Picture">

            <div class="home-profile-info">
                <h2 id="usernameDisplay">Loading...</h2>

                <div class="user-stats">

    <span id="levelDisplay">Level 1</span>

    <span class="coin-balance">
        $<span id="balanceDisplay">0</span>
    </span>

</div>

<div class="xp-section">

    <div class="xp-label">
        <span id="xpDisplay">0 XP</span>

        <span id="nextLevelDisplay">Next Level</span>
    </div>

    <div class="xp-bar">

        <div id="xpFill" class="xp-fill"></div>

    </div>

</div>
            </div>

        </div>

    </div>

    <div class="section-title">
        Featured Games
    </div>

    <div class="games-container">

        <div class="game-card">
            <img src="../assets/clashroyale.jpg" alt="Clash Royale">
            <button id="clashPlayBtn">PLAY NOW</button>
        </div>

        <div class="game-card coming-soon-card">
            <div class="coming-soon-banner">COMING SOON</div>
            <img src="../assets/fc26.jpg" alt="FC26">
        </div>

        <div class="game-card coming-soon-card">
            <div class="coming-soon-banner">COMING SOON</div>
            <img src="../assets/fortnite.jpg" alt="Fortnite">
        </div>

    </div>

    <div class="quick-actions">

        <div class="action-card">
            <div class="action-icon">🎮</div>
            <p>Play Games</p>
        </div>

        <div class="action-card">
            <div class="action-icon">🏆</div>
            <p>Leaderboard</p>
            <span>Coming Soon</span>
        </div>

        <div class="action-card">
            <div class="action-icon">📺</div>
            <p>Watch Live</p>
            <span>Coming Soon</span>
        </div>

    </div>

    <div class="section-title">
        Mega Prize Event
    </div>

    <div id="joinTournamentBtn" class="tournament-card">
        <img src="../assets/seasonzero-banner.png" alt="Season Zero">
    </div>

</div>

<script src="../js/home.js"></script>

</body>
</html>
