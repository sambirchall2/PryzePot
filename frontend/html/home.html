<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PryzePot Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/profile-system.css">
    <link rel="stylesheet" href="../css/coin-icon.css">
</head>

<body>

<div id="menuOverlay" class="menu-overlay"></div>

<div id="dailyRewardPopup" class="daily-reward-popup hidden">
    <div class="daily-reward-card">
        <img src="../assets/p-coin-stack.png" alt="Vault Credits" class="daily-reward-coin">
        <div class="daily-reward-title">Day <span id="dailyRewardStreak">1</span> Streak!</div>
        <div class="daily-reward-amount">+<span id="dailyRewardAmount">25</span> Vault Credits</div>
    </div>
</div>

<div id="sideMenu" class="side-menu">

    <div class="menu-header">
        Menu
    </div>

    <button id="profileBtn" class="menu-btn">
        Profile
    </button>

    <button id="friendsBtn" class="menu-btn">
    Friends
    <span id="friendRequestBadge" class="menu-badge hidden">0</span>
</button>

    <button id="vaultBtn" class="menu-btn">
        Vault
    </button>

    <button id="settingsBtn" class="menu-btn">
        Settings
    </button>

    <button id="menuLogoutBtn" class="menu-btn logout-btn">
        Logout
    </button>

</div>

<div class="app-shell">

    <div class="top-bar">

        <div id="menuToggle" class="left-section">
            ☰
        </div>

        <div class="brand-section">
    <img
        src="../assets/pryzepot-header.png"
        alt="PryzePot"
        class="header-logo"
    >
</div>

        <div class="right-section">

    <div id="friendsShortcut" class="friends-shortcut">
        👥

        <span id="onlineFriendsCount" class="online-friends-count hidden">
            0
        </span>
    </div>

    <div id="notificationBell" class="notification-bell">
        🔔

        <span id="notificationCount" class="notification-count hidden">
            0
        </span>
    </div>

    <div id="logoutBtn" class="logout-link">
        Logout
    </div>

</div>

    </div>
<div id="homeProfileCard" class="pp-home-card"></div>
<div id="activeTournamentBanner" class="active-tournament-banner hidden">
    <div class="active-tournament-text">
        <strong>TOURNAMENT IN PROGRESS</strong>
        <span>Return to your active tournament</span>
    </div>

    <button id="returnTournamentBtn" type="button">
        RETURN
    </button>
</div>

<div class="section-title">
        Featured Games
    </div>

    <div class="games-container">

        <div class="game-card">
            <img src="../assets/clashroyale.jpg" alt="Clash Royale">
            <button id="clashPlayBtn">PLAY NOW</button>
        </div>

        <div class="game-card coming-soon-card">
            <div class="coming-soon-banner">COMING SOON</div>
            <img src="../assets/street-fighter-6-card.jpg" alt="Street Fighter 6">
        </div>

        <div class="game-card coming-soon-card">
            <div class="coming-soon-banner">COMING SOON</div>
            <img src="../assets/rocket-league-card.jpg" alt="Rocket League">
        </div>

    </div>

    <div class="quick-actions">

        <div id="playGamesCard" class="action-card">
            <div class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="6" y1="12" x2="10" y2="12"></line>
                    <line x1="8" y1="10" x2="8" y2="14"></line>
                    <circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"></circle>
                    <circle cx="18" cy="11" r="1" fill="currentColor" stroke="none"></circle>
                    <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.544-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"></path>
                </svg>
            </div>
            <p>Play Games</p>
            <span>Browse Titles</span>
        </div>

        <div id="leaderboardCard" class="action-card">
            <div class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path>
                    <path d="M17 5h3a2 2 0 0 1-2 4h-1"></path>
                    <path d="M7 5H4a2 2 0 0 0 2 4h1"></path>
                    <path d="M8 21h8"></path>
                    <path d="M12 17v4"></path>
                </svg>
            </div>
            <p>Leaderboard</p>
            <span>View Rankings</span>
        </div>

        <div class="action-card disabled">
            <div class="action-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <polygon points="10,8.5 16,12 10,15.5" fill="currentColor" stroke="none"></polygon>
                </svg>
            </div>
            <p>Watch Live</p>
            <span>Coming Soon</span>
        </div>

    </div>
<section class="vault-home-section">
    <img
        id="vaultHomeBanner"
        class="vault-home-banner"
        src="../assets/vault/vault-home-banner.png"
        alt="Vault Player Rewards"
    >
</section>
    <div class="section-title">
        Mega Prize Event
    </div>

    <div id="joinTournamentBtn" class="tournament-card">
        <img src="../assets/seasonzero-banner.png" alt="Season Zero">
    </div>

</div>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/profile-system.js"></script>
<script src="../js/home.js"></script>

</body>
</html>
