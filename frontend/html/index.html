<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PryzePot Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="login-page">

        <div class="overlay">

            <div class="login-container">

                <img
                    class="logo"
                    src="../assets/logo.png"
                    alt="PryzePot Logo"
                >

                <input
                    id="usernameInput"
                    type="text"
                    placeholder="Username"
                    style="display: none;"
                >

                <input
                    id="emailInput"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="passwordInput"
                    type="password"
                    placeholder="Password"
                >

                <button
                    id="signInBtn"
                    class="sign-in-btn"
                >
                    SIGN IN
                </button>

                <p class="signup-text">
                    Create account?
                    <a href="#" id="showSignupLink">
                        Sign up
                    </a>
                </p>

            </div>

        </div>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/script.js"></script>

</body>
</html>
