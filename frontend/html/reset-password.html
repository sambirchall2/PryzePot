<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password | PryzePot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="login-page">

        <div class="overlay">

            <div class="login-container">

                <img
                    class="logo"
                    src="../assets/logo.png"
                    alt="PryzePot Logo"
                >

                <h2 class="forgot-title">
                    Set a new password
                </h2>

                <p class="forgot-subtitle" id="resetSubtitle">
                    Enter a new password for your account.
                </p>

                <input
                    id="newPasswordInput"
                    type="password"
                    placeholder="New password"
                >

                <input
                    id="confirmPasswordInput"
                    type="password"
                    placeholder="Confirm new password"
                >

                <button
                    id="resetSubmitBtn"
                    class="sign-in-btn"
                >
                    RESET PASSWORD
                </button>

                <p class="signup-text">
                    <a href="index.html">
                        Back to sign in
                    </a>
                </p>

            </div>

        </div>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/reset-password.js"></script>

</body>
</html>
