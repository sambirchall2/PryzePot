<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PryzePot Profile Setup</title>
    <link rel="stylesheet" href="../css/profile-setup.css">
</head>

<body>

<div class="app-shell">

    <div class="profile-header">
        <h1>Build Your Profile</h1>
        <p>Choose your PryzePot look.</p>
    </div>

    <div id="profilePreview" class="profile-preview">
        <img id="bannerPreview" class="banner-preview" src="../assets/profile/banner1.png" alt="Profile Banner">
        <div class="profile-overlay"></div>

        <div class="avatar-preview-wrap">
            <img id="avatarPreview" class="avatar-preview" src="../assets/profile/avatar1.png" alt="Profile Picture">
            <img id="framePreview" class="avatar-frame-preview hidden" src="" alt="Frame">
        </div>

        <h2 id="usernameDisplay">Username</h2>

        <img id="badgePreview" class="badge-preview hidden" src="" alt="Badge">

        <div id="titlePreview" class="level-pill">Level 1</div>

        <div class="xp-bar">
            <div class="xp-fill"></div>
        </div>

        <p class="xp-text">0 / 100 XP</p>
    </div>

    <div class="section-title">Unlocked Avatars</div>
    <div id="avatarOptions" class="avatar-grid"></div>

    <div class="section-title">Unlocked Banners</div>
    <div id="bannerOptions" class="banner-grid"></div>

    <div class="section-title">Unlocked Frames</div>
    <div id="frameOptions" class="avatar-grid"></div>

    <div class="section-title">Unlocked Badges</div>
    <div id="badgeOptions" class="avatar-grid"></div>

    <div class="section-title">Unlocked Titles</div>
    <div id="titleOptions" class="banner-grid"></div>

    <button id="saveProfileBtn" class="save-btn">
        SAVE PROFILE
    </button>

    <button id="skipProfileBtn" class="skip-btn">
        Skip for now
    </button>

</div>

<script src="../js/profile-setup.js"></script>

</body>
</html>
