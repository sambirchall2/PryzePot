<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PryzePot Profile Setup</title>
    <link rel="stylesheet" href="../css/profile-setup.css">
</head>

<body>

<div class="app-shell">

    <div class="profile-header">
        <h1>Build Your Profile</h1>
        <p>Choose your PryzePot look.</p>
    </div>

    <div id="profilePreview" class="profile-preview">
        <img id="bannerPreview" class="banner-preview" src="../assets/profile/banner1.png" alt="Profile Banner">

        <div class="profile-overlay"></div>

        <img id="avatarPreview" class="avatar-preview" src="../assets/profile/avatar1.png" alt="Profile Picture">

        <h2 id="usernameDisplay">Username</h2>

        <div class="level-pill">
            Level 1
        </div>

        <div class="xp-bar">
            <div class="xp-fill"></div>
        </div>

        <p class="xp-text">0 / 100 XP</p>
    </div>

    <div class="section-title">Choose Profile Picture</div>

    <div class="avatar-grid">

        <button class="avatar-option selected" data-avatar="avatar1">
            <img src="../assets/profile/avatar1.png" alt="Avatar 1">
        </button>

        <button class="avatar-option" data-avatar="avatar2">
            <img src="../assets/profile/avatar2.png" alt="Avatar 2">
        </button>

        <button class="avatar-option" data-avatar="avatar3">
            <img src="../assets/profile/avatar3.png" alt="Avatar 3">
        </button>

        <button class="avatar-option" data-avatar="avatar4">
            <img src="../assets/profile/avatar4.png" alt="Avatar 4">
        </button>

        <button class="avatar-option" data-avatar="avatar5">
            <img src="../assets/profile/avatar5.png" alt="Avatar 5">
        </button>

        <button class="avatar-option" data-avatar="avatar6">
            <img src="../assets/profile/avatar6.png" alt="Avatar 6">
        </button>

    </div>

    <div class="section-title">Choose Banner</div>

    <div class="banner-grid">

        <button class="banner-option selected" data-banner="banner1">
            <img src="../assets/profile/banner1.png" alt="Banner 1">
        </button>

        <button class="banner-option" data-banner="banner2">
            <img src="../assets/profile/banner2.png" alt="Banner 2">
        </button>

        <button class="banner-option" data-banner="banner3">
            <img src="../assets/profile/banner3.png" alt="Banner 3">
        </button>

        <button class="banner-option" data-banner="banner4">
            <img src="../assets/profile/banner4.png" alt="Banner 4">
        </button>

        <button class="banner-option" data-banner="banner5">
            <img src="../assets/profile/banner5.png" alt="Banner 5">
        </button>

        <button class="banner-option" data-banner="banner6">
            <img src="../assets/profile/banner6.png" alt="Banner 6">
        </button>

    </div>

    <button id="saveProfileBtn" class="save-btn">
        SAVE PROFILE
    </button>

    <button id="skipProfileBtn" class="skip-btn">
        Skip for now
    </button>

</div>

<script src="../js/profile-setup.js"></script>

</body>
</html>
