<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Sent | PryzePot</title>

    <link rel="stylesheet" href="../css/challenge-waiting.css">
</head>

<body>

<div class="waiting-page">

    <div class="waiting-card">

        <div class="wordmark-wrap">
    <img
        class="wordmark-logo"
        src="../assets/pryzepot-header.png"
        alt="PryzePot"
    >
</div>

        <p class="eyebrow">FRIEND CHALLENGE</p>

        <h1 id="waitingTitle">Waiting for opponent</h1>

        <div class="versus-card">
            <div>
                <div id="challengerName" class="player-name">You</div>
                <div class="player-label">Challenger</div>
            </div>

            <div class="vs-text">VS</div>

            <div>
                <div id="receiverName" class="player-name">Friend</div>
                <div class="player-label">Opponent</div>
            </div>
        </div>

        <div id="entryFeeText" class="entry-fee">$0 Match</div>

        <p id="waitingText" class="subtitle">
            Waiting for your friend to accept...
        </p>

        <div id="countdownText" class="countdown">
            5:00 remaining
        </div>

        <button id="cancelWaitingBtn" class="secondary-btn">
            CANCEL CHALLENGE
        </button>

    </div>

</div>

<script src="../js/challenge-waiting.js"></script>

</body>
</html>
