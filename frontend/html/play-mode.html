<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Do You Want To Play? | PryzePot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/play-mode.css">
</head>
<body>

    <button id="backBtn" class="back-btn">‹</button>

    <main class="play-mode-page">

        <h1>How Do You Want To Play?</h1>
        <p id="subtitle" class="subtitle">Choose how you'd like to start.</p>

        <button id="playNowBtn" class="play-mode-option">
            <span>Play Now</span>
            <small id="playNowHint">Create your match instantly and jump right in</small>
        </button>

        <button id="scheduleBtn" class="play-mode-option">
            <span>Schedule a Time</span>
            <small>Pick a day and time to play later</small>
        </button>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/play-mode.js"></script>

</body>
</html>
